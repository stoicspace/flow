appId: app.flowlens.desktop
productName: FlowLens
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - "!node_modules/**/{CHANGELOG.md,README.md,readme.md,LICENSE,license,License}"
asar: true
win:
  target: nsis
  icon: resources/icon.ico
  artifactName: "FlowLens-Setup-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FlowLens
mac:
  target: dmg
  icon: resources/icon.icns
  artifactName: "FlowLens-${version}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target: AppImage
  icon: resources/icon.png
  artifactName: "FlowLens-${version}.${ext}"
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
